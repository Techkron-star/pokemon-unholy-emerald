name: Compilar ROM

on:
  push:
    branches:
      - 'feat/**'
      - 'dev/**'
  pull_request:
    branches:
      - 'feat/unholy-genesis-puzzle-islands'
  workflow_dispatch:

# Si lanzas una build nueva en la misma rama, cancela la anterior en curso.
concurrency:
  group: rom-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  GAME_VERSION: EMERALD
  COMPARE: 0

jobs:
  build-rom:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar sprites y paletas Unholy
        run: python3 tools/unholy/validate_relic_assets.py

      - name: Instalar toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Verificar generador de rutas seguro
        run: |
          cc -DGENESIS_HOST -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tools/genesis/genesis_route_first_test.c src/genesis/genesis_core.c -o /tmp/genesis-route-first
          /tmp/genesis-route-first

      - name: Verificar topologia de modulos Genesis
        run: |
          python3 tools/genesis/genesis_climate.py
          python3 tools/genesis/genesis_puzzles.py
          python3 tools/genesis/genesis_puzzles.py --audit . > /tmp/genesis-puzzle-audit.json
          python3 tools/genesis/genesis_biomes.py --selftest
          python3 tools/genesis/genesis_route_modules.py --selftest

      - name: Precalcular terreno nativo de Genesis
        run: python3 tools/genesis/genesis_bake.py --output include/genesis_baked.generated.h

      - name: Verificar runtime Genesis 2
        run: |
          python3 tools/genesis/genesis2_modules_test.py
          make -C tools/genesis genesis2-test
          make -C tools/genesis genesis2-asan
          make -C tools/genesis genesis2-topology-test
          make -C tools/genesis genesis2-topology-asan

      - name: Compilar
        run: make GBAX=1 -j$(nproc) -O all

      - name: Ejecutar Genesis en CPU ARM emulada
        run: |
          git clone --no-checkout https://github.com/Techkron-star/mgba-android-extended.git "$RUNNER_TEMP/genesis-gbax"
          git -C "$RUNNER_TEMP/genesis-gbax" checkout --detach e06ebc4d2c3002a7189dc1e4242b5f80c381240b
          cmake -S "$RUNNER_TEMP/genesis-gbax" -B "$RUNNER_TEMP/genesis-gbax-build" \
            -DBUILD_LIBRETRO=ON -DSKIP_LIBRARY=ON -DBUILD_QT=OFF -DBUILD_SDL=OFF \
            -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF -DDISABLE_DEPS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/genesis-gbax-build" --target mgba_libretro -j2
          python3 tools/genesis/genesis2_arm_test.py --core "$RUNNER_TEMP/genesis-gbax-build/mgba_libretro.so"

      - name: Subir informe cromatico
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-coverage
          path: build/chromatic-coverage.json
          retention-days: 7
          if-no-files-found: error

      - name: Subir ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-rom
          path: pokeemerald.gba
          retention-days: 1
          if-no-files-found: error
