name: Compilar ROM

on:
  push:
    branches:
      - 'feat/**'
      - 'dev/**'
  workflow_dispatch:

# Si lanzas una build nueva en la misma rama, cancela la anterior en curso.
concurrency:
  group: rom-${{ github.ref }}
  cancel-in-progress: true

env:
  GAME_REVISION: 0
  GAME_LANGUAGE: ENGLISH
  GAME_VERSION: EMERALD
  COMPARE: 0

jobs:
  build-rom:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar sprites y paletas Unholy
        run: python3 tools/unholy/validate_relic_assets.py

      - name: Instalar toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev python3

      - name: Verificar generador de rutas seguro
        run: |
          cc -DGENESIS_HOST -std=c99 -O2 -Wall -Wextra -Werror -Iinclude tools/genesis/genesis_route_first_test.c src/genesis/genesis_core.c -o /tmp/genesis-route-first
          /tmp/genesis-route-first

      - name: Verificar topologia de modulos Genesis
        run: |
          python3 tools/genesis/genesis_climate.py
          python3 tools/genesis/genesis_puzzles.py
          python3 tools/genesis/genesis_puzzles.py --audit . > /tmp/genesis-puzzle-audit.json
          python3 tools/genesis/genesis_biomes.py --selftest
          python3 tools/genesis/genesis_route_modules.py --selftest

      - name: Compilar
        run: make -j$(nproc) -O all

      - name: Subir informe cromatico
        uses: actions/upload-artifact@v4
        with:
          name: chromatic-coverage
          path: build/chromatic-coverage.json
          retention-days: 7
          if-no-files-found: error

      - name: Subir ROM
        uses: actions/upload-artifact@v4
        with:
          name: pokeemerald-rom
          path: pokeemerald.gba
          retention-days: 1
          if-no-files-found: error
